
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - Day 5 Users</title>
    <script src="users.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes - User Directory</h1>
        <p>Load and search users from an API.</p>
    </header>

    <main>
        <section>
            <h2>Users</h2>

            <button id="load-users" type="button">Load Users</button>

            <label for="filter-input">Filter users by name:</label>
            <input
                type="text"
                id="filter-input"
                placeholder="Enter a user's name"
            >

            <p id="status" aria-live="polite">Click the button to load users.</p>

            <ul id="users-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes Day 5 Assignment</p>
    </footer>
</body>
</html>
